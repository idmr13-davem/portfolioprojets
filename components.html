<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Components — David Montealegre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20261013-body-light" />
  <link rel="stylesheet" href="css/components.css?v=20261013-colombia" />
  <style>
    /* ── Playground layout ── */
    body { min-height: 100vh; padding: 60px 80px; }

    .pg-header {
      margin-bottom: 64px;
      padding-bottom: 24px;
      border-bottom: 1px solid #333;
    }
    .pg-header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }
    .pg-header p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Sección de componente */
    .pg-section {
      margin-bottom: 72px;
    }
    .pg-section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pg-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }

    /* Row de estados */
    .pg-row {
      display: flex;
      align-items: flex-start;
      gap: 48px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    /* Celda individual */
    .pg-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .pg-state-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    [data-preview-state] {pointer-events:none;}
    .pg-icon {display:flex;align-items:center;justify-content:center;width:36px;height:36px;}
    .pg-icon img {max-width:none;}
    @media(max-width:767px) {body {padding:32px 16px;} .pg-row {gap:24px;}}
  </style>
</head>
<body class="has-mobile-layout">
  <div class="pg-header"><h1>Component library — Q3 2026</h1><p>Figma Units · Idle, hover and click share the production styles. Interactive controls are available in the live examples.</p></div>
  <main id="componentPreview"></main>
  <script src="js/i18n.js?v=20261009b"></script>
  <script src="js/main.js?v=20261013-colombia"></script>
  <script src="js/components-preview.js?v=20261013-colombia"></script>
</body></html>
